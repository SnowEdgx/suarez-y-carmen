services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
      - /app/.next-build
    env_file:
      - ./frontend/.env.local
    environment:
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:4000
      - BACKEND_INTERNAL_URL=http://backend:4000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
      cms:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env.local
    environment:
      - NODE_ENV=development
      - ENABLE_SUPABASE_TEST_ENDPOINT=${ENABLE_SUPABASE_TEST_ENDPOINT:-false}
      - RUNNING_IN_DOCKER=true
      - SUPABASE_URL=http://host.docker.internal:54321
      - SUPABASE_RESOURCE_BUCKET=${SUPABASE_RESOURCE_BUCKET:-course-resources}
      - CMS_SYNC_TOKEN=${CMS_SYNC_TOKEN:-local-cms-sync-token-change-me}
      - VIDEO_PLAYBACK_TOKEN_SECRET=${VIDEO_PLAYBACK_TOKEN_SECRET:-local-video-playback-token-change-me}
      - COURSE_RESOURCE_TOKEN_SECRET=${COURSE_RESOURCE_TOKEN_SECRET:-local-course-resource-token-change-me}
      - COURSE_RESOURCE_TOKEN_TTL_SECONDS=${COURSE_RESOURCE_TOKEN_TTL_SECONDS:-300}
      - VIDEO_AUDIT_HASH_SECRET=${VIDEO_AUDIT_HASH_SECRET:-local-video-audit-hash-change-me}
      - VIDEO_MAX_ACTIVE_DEVICES=${VIDEO_MAX_ACTIVE_DEVICES:-2}
      - VIDEO_DEVICE_INACTIVITY_DAYS=${VIDEO_DEVICE_INACTIVITY_DAYS:-30}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  cms-db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=syc_cms
      - POSTGRES_USER=syc_cms
      - POSTGRES_PASSWORD=syc_cms_password
    volumes:
      - cms-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syc_cms -d syc_cms"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile.dev
    ports:
      - "1337:1337"
    volumes:
      - ./cms:/app
      - /app/node_modules
      - /app/.tmp
      - /app/build
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=1337
      - PUBLIC_URL=http://localhost:1337
      - DATABASE_CLIENT=postgres
      - DATABASE_HOST=cms-db
      - DATABASE_PORT=5432
      - DATABASE_NAME=syc_cms
      - DATABASE_USERNAME=syc_cms
      - DATABASE_PASSWORD=syc_cms_password
      - APP_KEYS=local-app-key-a,local-app-key-b
      - API_TOKEN_SALT=local-api-token-salt
      - ADMIN_JWT_SECRET=local-admin-jwt-secret
      - ADMIN_ENCRYPTION_KEY=local-admin-encryption-key-change-me
      - TRANSFER_TOKEN_SALT=local-transfer-token-salt
      - JWT_SECRET=local-jwt-secret
      - CMS_SYNC_BACKEND_URL=http://backend:4000
      - CMS_SYNC_TOKEN=${CMS_SYNC_TOKEN:-local-cms-sync-token-change-me}
      - CMS_SYNC_TIMEOUT_MS=${CMS_SYNC_TIMEOUT_MS:-5000}
      - STRAPI_TELEMETRY_DISABLED=true
    depends_on:
      backend:
        condition: service_healthy
      cms-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:1337/admin').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

volumes:
  cms-db-data:
